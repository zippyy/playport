# SPDX-License-Identifier: GPL-3.0-or-later
# Manual, unsigned IPA build. No Apple account or signing certificate is needed.
# Required repository secrets: PLAYPORT_SDK_ARCHIVE_URL, PLAYPORT_SDK_SHA256,
# PLAYPORT_MINGW_ARCHIVE_URL, PLAYPORT_MINGW_SHA256.
# The SDK archive must contain the xtool Darwin SDK tree (Developer/Toolchains/...,
# Platforms/iPhoneOS.platform/... and Platforms/MacOSX.platform/...).
# The mingw archive must contain the llvm-mingw 20260922 toolchain already patched
# with the arm64ec CRT rebuild described in docs/BUILDING.md.
name: Playport Forever unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playport-forever-ipa
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PLAYPORT_SDK_ARCHIVE_URL: ${{ secrets.PLAYPORT_SDK_ARCHIVE_URL }}
      PLAYPORT_SDK_SHA256: ${{ secrets.PLAYPORT_SDK_SHA256 }}
      PLAYPORT_MINGW_ARCHIVE_URL: ${{ secrets.PLAYPORT_MINGW_ARCHIVE_URL }}
      PLAYPORT_MINGW_SHA256: ${{ secrets.PLAYPORT_MINGW_SHA256 }}
      JOBS: "4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Ensure the build inputs are configured
        shell: bash
        run: |
          set -euo pipefail
          for key in PLAYPORT_SDK_ARCHIVE_URL PLAYPORT_SDK_SHA256 PLAYPORT_MINGW_ARCHIVE_URL PLAYPORT_MINGW_SHA256; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing ${key} repository secret. See docs/BUILDING.md; GitHub runners do not ship Apple's iOS SDK or Playport's patched MinGW."
              exit 1
            fi
          done
      - name: Free runner space and install host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/powershell
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bison flex gettext cmake ninja-build meson python3-pefile xxd openssl patch git rsync p7zip-full curl jq libssl-dev libxml2-dev
          df -h .
      - name: Unpack checksum-verified build inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/inputs/darwin-sdk .work/inputs/llvm-mingw .work/downloads
          curl --fail --location --retry 3 --output .work/downloads/sdk.tar.gz "$PLAYPORT_SDK_ARCHIVE_URL"
          echo "$PLAYPORT_SDK_SHA256  .work/downloads/sdk.tar.gz" | sha256sum -c -
          tar -xzf .work/downloads/sdk.tar.gz -C .work/inputs/darwin-sdk
          curl --fail --location --retry 3 --output .work/downloads/mingw.tar.gz "$PLAYPORT_MINGW_ARCHIVE_URL"
          echo "$PLAYPORT_MINGW_SHA256  .work/downloads/mingw.tar.gz" | sha256sum -c -
          tar -xzf .work/downloads/mingw.tar.gz -C .work/inputs/llvm-mingw
          rm -f .work/downloads/*.tar.gz
          test -e .work/inputs/llvm-mingw/aarch64-w64-mingw32/lib/libgcc.a
          test -x .work/inputs/llvm-mingw/bin/aarch64-w64-mingw32-clang
      - name: Verify Linux toolchain requirements
        shell: bash
        run: |
          set -euo pipefail
          for cmd in clang clang++ ld64.lld llvm-ar llvm-nm llvm-objdump llvm-objcopy llvm-lipo swift; do
            command -v "$cmd" >/dev/null || { echo "::error::Missing $cmd. Install the LLVM 22 and Swift toolchains specified in docs/BUILDING.md on the build runner."; exit 1; }
          done
          if ! clang --version | head -1 | grep -Eq 'version 22\.'; then
            echo "::error::This build requires host LLVM 22.x (docs/BUILDING.md)."
            exit 1
          fi
      - name: Build unsigned release IPA
        shell: bash
        env:
          LLVM_MINGW: ${{ github.workspace }}/.work/inputs/llvm-mingw
          DARWIN_SDK: ${{ github.workspace }}/.work/inputs/darwin-sdk
        run: |
          set -euo pipefail
          ./pp setup
          ./pp build --variant release --unsigned
          find .work/out -name '*release-unsigned-*.ipa' -type f -print
      - name: Collect verified IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .work/upload
          mapfile -t ipa < <(find .work/out -name '*release-unsigned-*.ipa' -type f)
          test "${#ipa[@]}" -eq 1 || { echo "::error::Expected exactly one verified unsigned IPA"; exit 1; }
          cp "${ipa[0]}" .work/upload/Playport-Forever-unsigned.ipa
          sha256sum .work/upload/*.ipa > .work/upload/SHA256SUMS
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Playport-Forever-unsigned-IPA
          path: .work/upload/
          if-no-files-found: error
          retention-days: 7
